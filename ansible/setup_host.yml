---
- name: Configure a Docker-ready Ubuntu host
  hosts: devops
  become: true
  gather_facts: true

  vars:
    deployer_user: deployer
    app_directory: /opt/app

  pre_tasks:
    - name: Assert Ubuntu target
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
        fail_msg: This playbook supports Ubuntu 20.04/22.04 images only.

    - name: Install prerequisites for Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Create Docker keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker repository signing key
      # curl avoids a Python 3.12/urllib3 TLS incompatibility seen on Ubuntu 24.04.
      # creates keeps the task idempotent on subsequent playbook runs.
      ansible.builtin.command:
        cmd: >-
          curl --fail --silent --show-error --location
          https://download.docker.com/linux/ubuntu/gpg
          --output /etc/apt/keyrings/docker.asc
        creates: /etc/apt/keyrings/docker.asc

    - name: Set Docker repository signing key permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/docker.asc
        state: file
        mode: '0644'
      # In check mode the preceding curl command is deliberately not executed.
      when: not ansible_check_mode

    - name: Configure Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

  tasks:
    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable Docker now and after reboot
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Create deployer user with sudo and Docker access
      ansible.builtin.user:
        name: "{{ deployer_user }}"
        groups: sudo,docker
        append: true
        shell: /bin/bash
        create_home: true

    - name: Permit deployer passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ deployer_user }}"
        content: "{{ deployer_user }} ALL=(ALL) NOPASSWD:ALL\\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ deployer_user }}"
        group: "{{ deployer_user }}"
        mode: '0755'

    - name: Copy Compose project
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ app_directory }}/{{ item }}"
        owner: "{{ deployer_user }}"
        group: "{{ deployer_user }}"
        mode: '0644'
      loop:
        - docker-compose.yml
        - nginx.conf
        - index.html
      notify: Start application stack

    - name: Install monitoring utility alongside the Compose project
      ansible.builtin.copy:
        src: ../scripts/monitor.sh
        dest: "{{ app_directory }}/monitor.sh"
        owner: "{{ deployer_user }}"
        group: "{{ deployer_user }}"
        mode: '0755'

  handlers:
    - name: Start application stack
      community.docker.docker_compose_v2:
        project_src: "{{ app_directory }}"
        state: present
